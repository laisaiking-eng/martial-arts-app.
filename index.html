<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>武術會記帳系統</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; padding: 0; background-color: #f4f7f6; }
    h1 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { padding: 10px; width: 100%; max-width: 400px; box-sizing: border-box; margin-bottom: 10px; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
    .delete-btn { background-color: #dc3545; width: auto; padding: 5px 10px; margin: 0; font-size: 14px; }
    .delete-btn:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <h1>🥋 武術會記帳系統</h1>

  <div class="form-group">
    <label for="date">日期：</label>
    <input type="date" id="date">

    <label for="category">類別：</label>
    <select id="category">
      <option value="收入">收入</option>
      <option value="支出">支出</option>
    </select>

    <label for="description">項目說明：</label>
    <input type="text" id="description" placeholder="例如：學費、器材費">

    <label for="amount">金額：</label>
    <input type="number" id="amount" placeholder="金額">

    <button id="add-btn">新增帳目紀錄</button>
  </div>

  <h2>帳目明細</h2>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>類別</th>
        <th>說明</th>
        <th>金額</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="records-body">
      <!-- 資料會自動載入到這裡 -->
    </tbody>
  </table>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 專屬 Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyBpge6e4Gk8ab5590Y0EIW6loGA8hVwdBM",
      authDomain: "kungfu-account.firebaseapp.com",
      projectId: "kungfu-account",
      storageBucket: "kungfu-account.firebasestorage.app",
      messagingSenderId: "381501844767",
      appId: "1:381501844767:web:fbb510db7fd2ca1cd3542a",
      measurementId: "G-SZCCJ3N3MD"
    };

    // 初始化 Firebase 與 Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const recordsRef = collection(db, "records");

    // 預設密碼
    const SECRET_PASSWORD = "class";

    // 預設日期為今天
    document.getElementById('date').valueAsDate = new Date();

    // 載入資料庫帳目
    async function loadRecords() {
      const tbody = document.getElementById('records-body');
      tbody.innerHTML = '';
      
      try {
        const q = query(recordsRef, orderBy("date", "desc"));
        const querySnapshot = await getDocs(q);
        
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.date}</td>
            <td>${data.category}</td>
            <td>${data.description}</td>
            <td>$${data.amount}</td>
            <td><button class="delete-btn" data-id="${docSnap.id}">刪除</button></td>
          `;
          tbody.appendChild(tr);
        });

        // 綁定刪除事件
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const password = prompt("請輸入密碼以刪除帳目：");
            if (password === SECRET_PASSWORD) {
              const id = e.target.getAttribute('data-id');
              await deleteDoc(doc(db, "records", id));
              loadRecords();
            } else if (password !== null) {
              alert("密碼錯誤！");
            }
          });
        });
      } catch (error) {
        console.error("載入失敗：", error);
      }
    }

    // 新增帳目功能
    document.getElementById('add-btn').addEventListener('click', async () => {
      const date = document.getElementById('date').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const amount = Number(document.getElementById('amount').value);

      if (!description || !amount) {
        alert("請填寫完整的項目說明與金額！");
        return;
      }

      const password = prompt("請輸入密碼以新增帳目：");
      if (password === SECRET_PASSWORD) {
        try {
          await addDoc(recordsRef, {
            date,
            category,
            description,
            amount,
            createdAt: new Date()
          });
          document.getElementById('description').value = '';
          document.getElementById('amount').value = '';
          alert("儲存成功！");
          loadRecords();
        } catch (error) {
          alert("儲存失敗，請檢查網路或資料庫設定！");
          console.error(error);
        }
      } else if (password !== null) {
        alert("密碼錯誤！");
      }
    });

    // 網頁載入時自動讀取資料
    loadRecords();
  </script>
</body>
</html>
